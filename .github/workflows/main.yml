name: Resign and Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  resign-and-upload:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Install Certificates and Profile
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }} # Убедитесь, что в секрете P12_PASSWORD сохранено 123456
        run: |
          # Импорт сертификата (Берем файл прямо из репозитория)
          security create-keychain -p "" build.keychain
          security import release_mac.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "" build.keychain

          # Установка профиля (Берем файл прямо из репозитория)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp FastAuto_Real_Profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/resigned.mobileprovision

      - name: 🛠 Resign IPA
        env:
          OLD_BUNDLE_ID: "com.parts.fastauto"
        run: |
          # Находим наш IPA
          IPA_NAME=$(find . -name "*.ipa" | head -n 1)
          
          # Распаковываем
          unzip -q "$IPA_NAME" -d temp_resign
          APP_PATH=$(find temp_resign/Payload -name "*.app")
          
          # Меняем Bundle ID в Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $OLD_BUNDLE_ID" "$APP_PATH/Info.plist"
          
          # Вытаскиваем Entitlements из профиля
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/resigned.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' profile.plist > entitlements.plist
          
          # Подменяем профиль внутри приложения
          cp ~/Library/MobileDevice/Provisioning\ Profiles/resigned.mobileprovision "$APP_PATH/embedded.mobileprovision"
          
          # Переподписываем
          rm -rf "$APP_PATH/_CodeSignature"
          CERT_NAME=$(security find-identity -v -p codesigning build.keychain | grep "Apple Distribution" | head -1 | grep -o '".*"' | sed 's/"//g')
          echo "Использую сертификат: $CERT_NAME"
          /usr/bin/codesign -f -s "$CERT_NAME" --entitlements entitlements.plist "$APP_PATH"
          
          # Запаковываем обратно
          cd temp_resign
          zip -qr ../Resigned_App.ipa Payload
          cd ..

      - name: 🚀 Upload to TestFlight
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          
          xcrun altool --upload-app \
                       --type ios \
                       --file Resigned_App.ipa \
                       --apiKey $KEY_ID \
                       --apiIssuer $ISSUER_ID
