name: Resign and Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  resign-and-upload:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Generate and Install Certificates
        env:
          PRIVATE_KEY: ${{ secrets.IOS_PRIVATE_KEY }}
          CERT_PEM: ${{ secrets.IOS_CERT_PEM }}
          PROVISION_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          echo "$PRIVATE_KEY" > private.key
          echo "$CERT_PEM" > cert.pem

          openssl pkcs12 -export -out cert.p12 -inkey private.key -in cert.pem -passout pass:123456

          # 1. Создаем связку ключей с паролем "actions" и делаем ее основной
          security create-keychain -p "actions" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "actions" build.keychain
          
          # 2. Импортируем с флагом -A (Разрешить всем программам брать ключ без вопросов)
          security import cert.p12 -k build.keychain -P "123456" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROVISION_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/resigned.mobileprovision

      - name: 🛠 Resign IPA
        env:
          OLD_BUNDLE_ID: "com.parts.fastauto"
        run: |
          IPA_NAME=$(find . -name "*.ipa" | head -n 1)
          
          unzip -q "$IPA_NAME" -d temp_resign
          APP_PATH=$(find temp_resign/Payload -name "*.app")
          
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $OLD_BUNDLE_ID" "$APP_PATH/Info.plist"
          
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/resigned.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' profile.plist > entitlements.plist
          
          cp ~/Library/MobileDevice/Provisioning\ Profiles/resigned.mobileprovision "$APP_PATH/embedded.mobileprovision"
          
          rm -rf "$APP_PATH/_CodeSignature"
          
          CERT_NAME=$(security find-identity -v -p codesigning build.keychain | grep '"' | head -1 | grep -o '".*"' | sed 's/"//g')
          echo "Использую сертификат: $CERT_NAME"
          
          # 3. Аккуратно подписываем фреймворки (если они есть), чтобы codesign не завис
          find "$APP_PATH/Frameworks" -type f -name "*.dylib" -exec /usr/bin/codesign -f -s "$CERT_NAME" {} \; 2>/dev/null || true
          find "$APP_PATH/Frameworks" -type d -name "*.framework" -exec /usr/bin/codesign -f -s "$CERT_NAME" {} \; 2>/dev/null || true
          
          # 4. Подписываем само приложение
          /usr/bin/codesign -f -s "$CERT_NAME" --entitlements entitlements.plist "$APP_PATH"
          
          cd temp_resign
          zip -qr ../Resigned_App.ipa Payload
          cd ..

      - name: 🚀 Upload to TestFlight
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "$API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          
          xcrun altool --upload-app \
                       --type ios \
                       --file Resigned_App.ipa \
                       --apiKey $KEY_ID \
                       --apiIssuer $ISSUER_ID
